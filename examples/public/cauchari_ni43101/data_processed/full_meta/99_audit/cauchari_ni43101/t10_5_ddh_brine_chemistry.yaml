  \      target_col: pozo_id\n  semantics:\n    description: >-\n      Brine chemistry\
  \ averaged over depth intervals for DDH-01, 04, 06, 08, 12 and 13 (B, K, Li, Mg,\
  \ SO4,\n      Mg/Li). Source: NI 43-101 technical report on the Cauchari-Olaroz\
  \ operation (effective Jan 8 2025),\n      Table 10.5 (printed p.152, PDF p.168).\n\
  \    grain: one row per DDH hole and depth interval - an interval average, not a\
  \ point sample\n    caveats: >-\n      THIS table writes a point as THOUSANDS separator\
  \ in K, Mg and SO4 (4.847 = 4847) while Mg/Li is\n      a true decimal (2.20); both\
  \ were normalized to plain numbers (rule: d.ddd in K/Mg/SO4 -> thousands).\n   \
  \   length_m differs from to_m - from_m in some rows exactly as printed and the\
  \ report does not explain\n      it. The table has no K/Li or SO4/Li. Every row\
  \ is already an average over an interval of very different\n      length: weight\
  \ by interval length when averaging, and do not pool Tables 10.3, 10.5 and 10.7\
  \ without\n      considering campaign, sampling method and laboratory.\n    temporal_scope:\
  \ campaign_window\n    cross_tables:\n    - t10_4_ddh_boreholes_2009_2010\n    -\
  \ wells\n    column_info:\n      tabla: report table number the row was extracted\
