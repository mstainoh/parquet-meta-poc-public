  \ digits); joins `wells.pozo_id`\n      from_m: interval top, m\n      to_m: interval\
  \ bottom, m\n      length_m: interval length as printed\n      b_mg_l: boron, mg/L\n\
  \      k_mg_l: potassium, mg/L (source uses '.' as thousands)\n      li_mg_l: lithium,\
  \ mg/L\n      mg_mg_l: magnesium, mg/L\n      so4_mg_l: sulfate, mg/L (source uses\
  \ '.' as thousands)\n      mg_li_orig: Mg/Li as printed (decimal)\n      mg_li_recalc:\
