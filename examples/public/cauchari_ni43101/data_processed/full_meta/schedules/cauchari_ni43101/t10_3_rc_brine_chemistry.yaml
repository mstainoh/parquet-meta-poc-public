schema_version: null
keys:
  uniques:
  - well_id
  - from_m
  - to_m
  not_nulls:
  - well_id
  - from_m
  - to_m
  foreign_keys:
  - source_col: well_id
    target_table: t10_1_rc_boreholes
    target_col: well_id
  - source_col: well_id
    target_table: wells
    target_col: pozo_id
semantics:
  description: 'Brine chemistry averaged over depth intervals of the RC boreholes
    PE-04..PE-22 (B, K, Li, Mg, SO4 and ratios). Source: NI 43-101 technical report
    on the Cauchari-Olaroz operation (effective Jan 8 2025), Table 10.3 (printed p.149-150,
    PDF p.165-166).'
  grain: one row per RC borehole and depth interval - an interval average, not an
    individual sample
  caveats: 'Values are averages over the interval, not point samples. mg_li_orig is
    Mg/Li rounded to an integer as printed; use mg_li_recalc (mg_mg_l / li_mg_l, 2
    decimals) for any calculation. Convention in source: comma = thousands in concentrations,
    point = decimal in ratios. length_m is smaller than to_m - from_m in some rows
    exactly as printed (unsampled metres, lost circulation while drilling); do not
    ''fix'' it. Outliers are kept as printed and flagged in `nota` and in inspect.
    Every row is already an average over an interval of very different length: weight
    by interval length when averaging, and do not pool Tables 10.3, 10.5 and 10.7
    without considering campaign, sampling method and laboratory.'
  temporal_scope: campaign_window
  cross_tables:
  - t10_1_rc_boreholes
  - wells
  column_info:
    tabla: report table number the row was extracted from
    pag_impresa: printed page of the report where the row is
    pag_pdf: PDF page of the row (printed page + 16)
    nota: free-text flag written at extraction (source typo, outlier, reconstructed
      row, cross-check result); empty = nothing to flag
    well_id: RC borehole id; joins `t10_1_rc_boreholes` and `wells.pozo_id`
    from_m: interval top, m (depth reference not stated in the source)
    to_m: interval bottom, m (same reference as from_m)
    length_m: interval length as printed (may be < to_m - from_m)
    b_mg_l: boron, mg/L
    k_mg_l: potassium, mg/L
    li_mg_l: lithium, mg/L
    mg_mg_l: magnesium, mg/L
    so4_mg_l: sulfate, mg/L
    mg_li_orig: Mg/Li as printed, rounded to integer
    k_li: K/Li ratio as printed
    so4_li: SO4/Li ratio as printed (recomputing from the concentrations differs by
      up to ~0.1%)
    mg_li_recalc: Mg/Li computed from mg_mg_l / li_mg_l (not in the source)
inspect: null
file_columns:
- tabla
- pag_impresa
- pag_pdf
- well_id
- from_m
- to_m
- length_m
- b_mg_l
- k_mg_l
- li_mg_l
- mg_mg_l
- so4_mg_l
- mg_li_orig
- k_li
- so4_li
- mg_li_recalc
- nota
