findings:
- columns:
  - well_id
  - from_m
  - to_m
  severity: data_error
  note: >-
    DDH-06 intervals 118-136 and 140-190 m go below DDH-06's total depth of 129 m in Table 10.4 (text p.151/PDF
    167, checked on the page image). The twin DDH-06A is 338.5 m deep. These rows (and maybe 100-115) probably belong
    to DDH-06A, or Table 10.4 swapped the depths of DDH-6/DDH-6A (it lists 6A before 6). Either way a join to t10_4
    by well_id gives sample depths below the hole bottom. The rows were kept as printed.
- columns:
  - length_m
  - from_m
  - to_m
  severity: note
  note: >-
    Text p.152/PDF 168: the brine came from observation wells built in selected DD holes (Schedule 80 2-inch PVC
    with 1 mm slotted screen), sampled March-August 2010. Samples were "initially collected with a low-flow pump.
    However, later samples were collected with a bailer". The method changes within the table and is not identified
    per row. Unlike Table 10.3, nothing in the text explains why length_m differs from to_m - from_m. The 2 rows
    with length_m > to_m - from_m (DDH-01 70-105, DDH-06 140-190) stay unexplained. Table 10.2 gives 127 DDH field
    samples for these 14 intervals.
