  - b_mg_l
  - k_mg_l
  - li_mg_l
  - mg_mg_l
  - so4_mg_l
  severity: note
  note: >-
    Labs and methods are the same as for Table 10.3 (section 11.6.1, text p.180/PDF 196): ASA (ICP for K, Li, Mg,
    B; gravimetric SO4) or the uncertified internal Exar lab (AA for Li and K, titration for Mg). Which lab produced
    which row is not stated. QA/QC is in Section 12 (not audited).
