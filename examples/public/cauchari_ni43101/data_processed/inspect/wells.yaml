  severity: note
  note: >-
    Twin pairs at the same site are not in well_aliases: PE-14/PE-14A (PE-14A drilled 144-228 m below PE-14's 144
    m; Table 10.1) and DDH-06/DDH-06A. Each pair's chemistry appears under the shallow twin's id while its depths
    only fit the deep twin (t10_3, t10_5 sidecars). The other twins (DDH-04A, 08A, 09A, 10A, 10B, 12A, 13A-D, PE-17A)
    have no such conflict in the audited tables. DD19D-PE09 was drilled on platform "PE-09" (Table 10.6), so its
    XY (3419473/7374367) is a hint of PE-09's location, which has no coordinates. This is an inference only and
    was not filled in.
