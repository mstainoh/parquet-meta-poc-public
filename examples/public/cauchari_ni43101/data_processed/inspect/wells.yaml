  severity: note
  note: >-
    RC17S-014 / DD17D-014. Text p.152 says shallow and intermediate piezometers share one borehole and the deep
    hole is 15 m away. In 10.6, SL-014 (and Table 15.3) has exactly DL-014's XY (0 m apart), while ML-014 is 21
    m away. The registry takes ML-014's XY for RC17S-014, which is the option that fits the text. DD17D-014's XY
    (copied from 10.6) may be the duplicated one; it is flagged xy_conflicto = false even though it is identical
    to SL-014's.
- columns:
