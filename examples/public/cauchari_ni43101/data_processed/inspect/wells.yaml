  note: >-
    Text p.161/PDF 177 says 43 production wells were drilled since 2011; Table 10.8 details 38 (programa = PRODUCCION_10_8)
    and the 5 others are not identified in the report (the Pozo 44-46 numbering of Table 16.1 fits 43). programa
    = MODELO_APENDICE_2 holds wells that appear only in the Appendix 2 reserve-model table; whether they exist physically
    is not stated.
